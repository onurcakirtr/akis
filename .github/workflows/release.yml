# Otomatik sürüm: "v1.2.0" gibi bir etiket gönderilince APK derlenir ve GitHub Releases'e konur.
#   git tag v1.2.0 && git push origin v1.2.0
# Elle de çalıştırılabilir (Actions → Release → Run workflow).
#
# İsteğe bağlı kendi imza anahtarın için depo sırları (Settings → Secrets and variables → Actions):
#   AKIS_KEYSTORE_BASE64   keystore dosyasının base64 hâli
#   AKIS_KEYSTORE_PASSWORD
#   AKIS_KEY_ALIAS
#   AKIS_KEY_PASSWORD
# Sırlar yoksa APK debug anahtarıyla imzalanır (kurulur ama sürümler arası güncelleme için aynı anahtar gerekir).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (ör. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          # Her sürümde artan sürüm kodu
          echo "code=$(( GITHUB_RUN_NUMBER + 100 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AKIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/akis.jks"
            echo "AKIS_KEYSTORE=$RUNNER_TEMP/akis.jks" >> "$GITHUB_ENV"
            echo "Own signing key in use"
          else
            echo "::warning::No signing secrets; the APK is signed with a debug key"
          fi

      - name: Build APK
        env:
          AKIS_KEYSTORE_PASSWORD: ${{ secrets.AKIS_KEYSTORE_PASSWORD }}
          AKIS_KEY_ALIAS: ${{ secrets.AKIS_KEY_ALIAS }}
          AKIS_KEY_PASSWORD: ${{ secrets.AKIS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PakisVersionName=${{ steps.v.outputs.name }} -PakisVersionCode=${{ steps.v.outputs.code }}
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Akis-${{ steps.v.outputs.name }}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Akış ${{ steps.v.outputs.name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            ### 📦 Install / Kurulum
            Download **Akis-${{ steps.v.outputs.name }}.apk** below and open it on your phone (Android 10+).
            Aşağıdaki **Akis-${{ steps.v.outputs.name }}.apk** dosyasını indirip telefonunda aç (Android 10+).

            Remote access (Cloudflare Tunnel) works on 64-bit ARM phones. · Uzaktan erişim 64 bit ARM telefonlarda çalışır.
