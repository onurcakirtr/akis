<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="icon" href="/icon.png?v={{ICONV}}">
<style>{{THEME}}</style>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="top">
  <a class="brand nav" href="#/"><span class="dot"></span><span id="brandName"></span></a>
  <form id="searchForm" class="search" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" class="nav" type="search" autocomplete="off" enterkeyhint="search">
    <kbd>/</kbd>
  </form>
  <button id="lookBtn" class="pill nav" type="button" hidden aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.3-.3-.3-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.3-4-7.7-9-7.7z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg></button>
  <a id="adminBtn" class="pill nav" href="#/admin" hidden aria-label="admin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></a>
  <button id="upBtn" class="pill nav" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg><span id="upLabel"></span>
  </button>
</header>
<main id="view" tabindex="-1"></main>

<div id="mini" class="mini" hidden></div>
<aside id="upload" class="upload" hidden></aside>
<div id="lightbox" class="lightbox" hidden></div>
<div id="lookPanel" class="look" role="dialog" hidden></div>
<div id="toast" class="toast" role="status"></div>

<script>window.AKIS = {{CONF}};</script>
<script src="/static/player.js"></script>
<script src="/static/admin.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
