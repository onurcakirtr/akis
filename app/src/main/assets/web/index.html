<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="icon" href="/icon.png?v={{ICONV}}">
<style>{{THEME}}</style>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="top">
  <a class="brand nav" href="#/"><span class="dot"></span><span id="brandName"></span></a>
  <form id="searchForm" class="search" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" class="nav" type="search" autocomplete="off" enterkeyhint="search">
    <kbd>/</kbd>
  </form>
  <button id="upBtn" class="pill nav" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg><span id="upLabel"></span>
  </button>
</header>
<main id="view" tabindex="-1"></main>

<div id="mini" class="mini" hidden></div>
<aside id="upload" class="upload" hidden></aside>
<div id="lightbox" class="lightbox" hidden></div>
<div id="toast" class="toast" role="status"></div>

<script>window.AKIS = {{CONF}};</script>
<script src="/static/player.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
